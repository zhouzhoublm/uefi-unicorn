#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
# 实测依据（本机 live device tree 的 reserved-memory + /proc/iomem）：
#   ramoops@0xa7000000 + 0x400000  ->  reserved 到 0xa73fffff
#   0xa7400000 不落在任何保留区内（脚本已校验），因此 FD 取 0xA7400000 长度 0x300000，
#   从 0xA7400000 到 0xA76FFFFF，避开 ramoops / xbl_sc / global_sync。
#
[uefi_fd]
base = 0xA7400000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
[boot_image]
header_version = 4
